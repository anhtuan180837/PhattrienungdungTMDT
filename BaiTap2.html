<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 2 - Định dạng CSS cơ bản</title>
    <style>
        /* Câu 2d: Lấy logo BIT kích cỡ 30px làm hình nền lặp lại và cố định */
        body {
            background-image: url('https://bit.ueh.edu.vn/wp-content/uploads/2017/06/BIT_logo.png');
            background-size: 30px;
            background-repeat: repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        /* Khung nền trắng mờ để dễ nhìn các câu a, b, c, e trên nền lặp */
        .container {
            background-color: rgba(255, 255, 255, 0.92);
            padding: 25px;
            border-radius: 8px;
            max-width: 700px;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Câu 2a: Chữ xanh, canh giữa, in đậm, gạch chân, 30px */
        .cau-a {
            color: blue;
            text-align: center;
            font-weight: bold;
            text-decoration: underline;
            font-size: 30px;
        }

        /* Câu 2b: Chữ đỏ, canh phải, in nghiêng, viền chấm vàng bo góc, nền xám, 15px, mờ 50% */
        .cau-b {
            color: red;
            text-align: right;
            font-style: italic;
            border: 3px dotted yellow;
            border-radius: 10px;
            background-color: gray;
            font-size: 15px;
            opacity: 0.5;
            padding: 10px;
        }

        /* Câu 2c: Định dạng chữ BIT-UEH giống hình (chữ nghệ thuật/đổ bóng/link) */
        .cau-c a {
           color: #A7DD3C;
background: #FFFFFF;
text-shadow: 2px 0 0px #800040, 3px 2px 0px rgba(77,0,38,0.5), 3px 0 3px #FF002B, 5px 0 3px #800015, 6px 2px 3px rgba(77,0,13,0.5), 6px 0 9px #FF5500, 8px 0 9px #802A00, 9px 2px 9px rgba(77,25,0,0.5), 9px 0 18px #FFD500, 11px 0 18px #806A00, 12px 2px 18px rgba(77,66,0,0.5), 12px 0 30px #D4FF00, 14px 0 30px #6A8000, 15px 2px 30px rgba(64,77,0,0.5), 15px 0 45px #80FF00, 17px 0 45px #408000, 17px 2px 45px rgba(38,77,0,0.5);
color: #A7DD3C;
background: #FFFFFF;
        }
        .cau-c a:hover {
            background: #005f6b;
            color: #fff;
        }

        /* Câu 2e: Rộng 100px, Cao 50px, ẩn tràn, cắt nội dung với dấu ..., nowrap */
        .cau-e {
            width: 100px;
            height: 50px;
            line-height: 50px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border: 1px solid #333;
            padding: 0 8px;
            background-color: #fff9c4;
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="cau-a">Đại học UEH</p>
        <p class="cau-b">Khoa CNTTKD</p>
        <p class="cau-c">
            <a href="https://bit.ueh.edu.vn" target="_blank">BIT-UEH</a>
        </p>
        <p class="cau-e" title="Nhu cầu xã hội Ngành Thương mại điện tử (TMĐT) tại Việt Nam hiện nay...">
            Nhu cầu xã hội Ngành Thương mại điện tử (TMĐT) tại Việt Nam hiện nay đang có những bước tăng trưởng mạnh mẽ và ngày càng đóng góp nhiều hơn cho sự phát triển kinh tế xã hội của đất nước. Thị trường TMĐT Việt Nam đã trở nên sôi động hơn khi có nhiều
        </p>
    </div>
</body>
</html>
