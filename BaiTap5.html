<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Khoa CNTTKD - Bài tập 5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 60px 20px;
        }
        .best-shared {
            text-align: center;
            max-width: 750px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .best-shared h2 {
            font-size: 32px;
            font-weight: normal;
            color: #333;
            margin: 20px 0 15px;
        }
        .best-shared h2 strong {
            color: #00acc1;
            font-weight: bold;
        }
        .lead-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .btn-list li {
            display: inline-block;
            margin: 0 8px;
        }
        .btn-list li a {
            display: inline-block;
            text-decoration: none;
            background-color: #2d3748;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 4px;
            font-size: 15px;
            transition: 0.3s;
        }
        .btn-list li a:hover {
            background-color: #00acc1;
        }
    </style>
</head>
<body>
    <section class="best-shared">
        <p class="logo"><img style="width:200px" src="https://bit.ueh.edu.vn/wp-content/uploads/2017/06/BIT_logo.png" alt="BIT Logo"></p>
        <h2>Best <strong>Shared Hosting</strong> Company</h2>
        <p class="lead-text">With this responsive landing page template, you can promote your all hosting, domain and email services.</p>
        <ul class="btn-list">
            <li><a href="./">View Plans</a></li>
            <li><a href="./">All Features</a></li>
        </ul>
    </section>
</body>
</html>
