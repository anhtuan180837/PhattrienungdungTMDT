<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 4 - Menu ngang</title>
    <style>
        ul {
            list-style-type: none;
            padding: 0;
            margin: 30px;
        }
        ul li {
            display: inline-block;
            margin-right: 5px;
        }
        ul li a {
            display: inline-block;
            text-decoration: none;
            background-color: #2b6cb0;
            color: #ffffff;
            padding: 10px 22px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        ul li a:hover {
            background-color: #c53030;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#">TMĐT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>
</body>
</html>
