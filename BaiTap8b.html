<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Bat Family</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        /* i. Khung chứa lớn (#root): kích thước: 1024px; margin; canh lề */
        #root {
            width: 1024px;
            margin: 0 auto;
            text-align: center;
            font-family: "Times New Roman", Times, serif;
        }

        /* ii. site-header (#site-header): canh lề; margin; background: màu, hình; màu; text-shadow */
        #site-header {
            text-align: center;
            margin: 20px auto 30px;
            background-color: transparent;
            background-image: url('imgs/logo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            color: #ffffff;
            text-shadow: 0 0 8px #000000, 2px 2px 4px #000000;
            padding: 45px 0;
            font-size: 32px;
        }

        /* Danh sách .superheroes */
        .superheroes {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* iii. li trong superheroes: width; display; position */
        .superheroes li {
            width: 185px;
            display: inline-block;
            position: relative;
            vertical-align: top;
            margin: 0 4px;
            transition: width 0.3s ease;
        }

        /* Định dạng tên nhân vật (.hero-header) nằm đè lên phía trên tấm ảnh */
        .superheroes li .hero-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 0;
            color: rgba(255, 255, 255, 0.75);
            font-size: 18px;
            text-shadow: 1px 1px 3px #000;
            box-sizing: border-box;
            border-radius: 15px 15px 0 0;
            transition: 0.3s;
        }

        /* iv. Hình trong superheroes: border; max-width */
        .superheroes li img {
            border: 2px solid #333333;
            border-radius: 15px;
            max-width: 100%;
            display: block;
            box-sizing: border-box;
        }

        /* v. Thẻ a trong superheroes: display; width; color; text-decoration */
        .superheroes li a {
            display: none;
            width: 100%;
            color: #ffffff;
            text-decoration: none;
            background-color: #666666;
            padding: 8px 0;
            margin-top: 6px;
            border-radius: 8px;
            font-size: 15px;
        }

        /* vi. Hover:
           1. Làm Read more: hiển thị; hiển thị underline
           2. Làm cho li trong superheroes: tăng chiều rộng */
        .superheroes li:hover {
            width: 240px;
        }

        .superheroes li:hover .hero-header {
            background-color: rgba(0, 0, 0, 0.75);
            color: #ffffff;
        }

        .superheroes li:hover a {
            display: block;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="root">
        <h1 id="site-header"><span>The Bat family</span></h1>
        <ul class="superheroes">
            <li>
                <strong class="hero-header">Batman</strong>
                <img src="imgs/superhero-1.jpg" alt="Batman">
                <a href="https://en.wikipedia.org/wiki/Batman">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Batwing</strong>
                <img src="imgs/superhero-2.jpg" alt="Batwing">
                <a href="https://en.wikipedia.org/wiki/Batwing_(DC_Comics)">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Batgirl</strong>
                <img src="imgs/superhero-3.jpg" alt="Batgirl">
                <a href="https://en.wikipedia.org/wiki/Batgirl">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Nightwing</strong>
                <img src="imgs/superhero-4.jpg" alt="Nightwing">
                <a href="https://en.wikipedia.org/wiki/Nightwing">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Red Robin</strong>
                <img src="imgs/superhero-5.jpg" alt="Red Robin">
                <a href="https://en.wikipedia.org/wiki/Red_Robin_(comics)">Read more</a>
            </li>
        </ul>
    </div>
</body>
</html>
