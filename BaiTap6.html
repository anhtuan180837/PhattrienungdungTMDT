    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            margin: 0;
            padding: 40px 15px;
        }
        .portfolio {
            max-width: 1110px;
            margin: 0 auto;
            text-align: center;
        }
        .portfolio h2 {
            font-size: 26px;
            color: #222;
            margin-bottom: 30px;
            position: relative;
            padding-bottom: 12px;
        }
        /* Đường gạch ngang màu xanh dưới tiêu đề MY PORTFOLIO */
        .portfolio h2::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 3px;
            background-color: #4db6ac;
        }
        .list-tab {
            list-style: none;
            padding: 0;
            margin: 0 0 35px 0;
        }
        .list-tab li {
            display: inline-block;
            margin: 0 12px;
        }
        .list-tab li a {
            text-decoration: none;
            color: #333;
            font-size: 15px;
            font-weight: bold;
            transition: color 0.2s;
        }
        .list-tab li:first-child a,
        .list-tab li a:hover {
            color: #4db6ac;
        }
        .galerry {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .galerry li {
            width: 31.5%;
            margin-bottom: 25px;
        }
        .galerry li img {
            width: 100%;
            height: auto;
            display: block;
        }
