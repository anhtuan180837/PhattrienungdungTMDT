<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 7 - Bố cục Layout</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            font-size: 22px;
            padding: 30px;
        }
        #wrapper {
            width: 550px;
            margin: 0 auto;
            border: 3px solid #000;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        header, nav, main, footer {
            border: 3px solid #000;
            padding: 10px 15px;
        }
        header {
            width: 100%;
            height: 70px;
        }
        header::before { content: "header"; }

        nav {
            width: calc(25% - 6px);
            height: 320px;
        }
        nav::before { content: "nav"; }

        main {
            width: calc(75% - 6px);
            height: 320px;
        }
        main::before { content: "main"; }

        footer {
            width: 100%;
            height: 60px;
        }
        footer::before { content: "footer"; }
    </style>
</head>
<body>
    <div id="wrapper">
        <header> </header>
        <nav> </nav>
        <main> </main>
        <footer> </footer>
    </div>
</body>
</html>
